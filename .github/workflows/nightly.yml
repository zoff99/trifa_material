name: Nightlyxxx

on:
  push:
    paths-ignore:
     - 'README.md'
     - 'CHANGELOG.md'
     - '.github/workflows/macos_pkg.yml'
     - '.github/workflows/screens_only_for_nightly_linux.yml'
     - '.github/workflows/screens_only_for_nightly_macos_arm.yml'
     - '.github/workflows/screens_only_for_nightly_macos.yml'
     - '.github/workflows/screens_only_for_nightly_win.yml'
     - '.github/workflows/jni_libs.yml'
     - 'circle_scripts/java_jni_lib_win-arm.sh'
     - 'circle_scripts/deps_win-arm.sh'
  pull_request:
    paths-ignore:
     - 'README.md'
     - 'CHANGELOG.md'
     - '.github/workflows/macos_pkg.yml'
     - '.github/workflows/screens_only_for_nightly_linux.yml'
     - '.github/workflows/screens_only_for_nightly_macos_arm.yml'
     - '.github/workflows/screens_only_for_nightly_macos.yml'
     - '.github/workflows/screens_only_for_nightly_win.yml'
     - '.github/workflows/jni_libs.yml'
  workflow_dispatch:
    inputs:
      version:
        description: dummy
        default: dummy

defaults:
  run:
    shell: bash

jobs:

  windows-arm-test:
    runs-on: windows-11-arm
    if: ${{ true }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Display the path
        run: echo %PATH%
        shell: cmd

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'

      - name: java-version
        run: java -version
        shell: bash

      - name: download tester
        shell: bash
        run: |
             curl -L https://github.com/zoff99/java_tox_tester/archive/refs/heads/master.zip -o master.zip
             unzip master.zip
             ls -al java_tox_tester-master/
             java -version
             javac -version

      - name: app_compile
        shell: bash
        run: |
          ./gradlew.bat assemble

      - name: app_startup
        shell: bash
        run: |
          ./gradlew.bat run

      - name: app_click_for_start
        shell: pwsh
        run: |
          [void] [System.Reflection.Assembly]::LoadWithPartialName("System.Drawing")
          [void] [System.Reflection.Assembly]::LoadWithPartialName("System.Windows.Forms")
          Start-Sleep -Seconds 260
          Start-Sleep -Seconds 8
          $signature=@'
          [DllImport("user32.dll",CharSet=CharSet.Auto,CallingConvention=CallingConvention.StdCall)]
          public static extern void mouse_event(long dwFlags, long dx, long dy, long cButtons, long dwExtraInfo);
          '@
          $SendMouseClick = Add-Type -memberDefinition $signature -name "Win32MouseEventNew" -namespace Win32Functions -passThru
          $x = 84
          $y = 104
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point($x, $y)
          sleep -Seconds 02
          $SendMouseClick::mouse_event(0x00000002, 0, 0, 0, 0);
          $SendMouseClick::mouse_event(0x00000004, 0, 0, 0, 0);
          sleep -Seconds 02
          $x = 146
          $y = 104
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point($x, $y)
          $SendMouseClick::mouse_event(0x00000002, 0, 0, 0, 0);
          $SendMouseClick::mouse_event(0x00000004, 0, 0, 0, 0);
          Start-Sleep -Seconds 2

      - name: capture-screen
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $Screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $Width  = $Screen.Width
          $Height = $Screen.Height
          $Left   = $Screen.Left
          $Top    = $Screen.Top
          $bitmap  = New-Object System.Drawing.Bitmap $Width, $Height
          $graphic = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphic.CopyFromScreen($Left, $Top, 0, 0, $bitmap.Size)
          $bitmap.Save("D:\a\trifa_material\trifa_material\screenshot009.png")
          Write-Output "Screenshot saved to:"
          Write-Output D:\a\trifa_material\trifa_material\screenshot009.png


      - name: app_check_log
        shell: bash
        run: |
          cat runlog.txt
          echo "xxxxxxxxxxxxxxxxxxxx"
          echo "xxxxxxxxxxxxxxxxxxxx"
          echo "xxxxxxxxxxxxxxxxxxxx"
          pwd
          ls -al
          sleep 20
          pwd
          ls -al
          sleep 20
          pwd
          ls -al
          cat runlog.txt
          echo "xxxxxxxxxxxxxxxxxxxx"
          echo "xxxxxxxxxxxxxxxxxxxx"
          echo "xxxxxxxxxxxxxxxxxxxx"
          ps -ef || echo "NOERR"

      - name: capture-screen
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $Screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $Width  = $Screen.Width
          $Height = $Screen.Height
          $Left   = $Screen.Left
          $Top    = $Screen.Top
          $bitmap  = New-Object System.Drawing.Bitmap $Width, $Height
          $graphic = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphic.CopyFromScreen($Left, $Top, 0, 0, $bitmap.Size)
          $bitmap.Save("D:\a\trifa_material\trifa_material\screenshot099.png")
          Write-Output "Screenshot saved to:"
          Write-Output D:\a\trifa_material\trifa_material\screenshot099.png

      - name: upload-screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-windows
          path: |
            D:\a\trifa_material\trifa_material\screenshot*.png






